name: Test env escape

on:
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: output
        id: output
        run: |
          echo "Testing: test\$VAR;`rm -rf`" >> $GITHUB_OUTPUT
      - name: not escaped
        run: |
          echo "values: ${{ steps.output.outputs.escaped }}"
      - name: escaped
        run: |
          echo "value: ${TEST}"
        env:
          TEST: ${{ steps.output.outputs.escaped }}